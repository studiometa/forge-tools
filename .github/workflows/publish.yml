name: Release

# Each merge into main releases what its fragments describe. A manual run
# (`gh workflow run publish.yml -f version=minor`) forces a bump.
# npm trusted publishing is bound to this file name: keep the publish job here,
# and do not call it from another workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version: `auto` follows the fragments; `patch`, `minor` or `major` forces that bump"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time. GitHub keeps only the newest pending run: it
# releases everything that main has at that point.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build all packages
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

  # Folds the fragments, bumps the root and every package (with
  # package-lock.json), commits `Release <version>`, tags, pushes and creates
  # the GitHub release.
  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Release
        id: release
        uses: weareikko/changelog@9d93346df9858eaa29007bd8530aad8f4c5b539a # 0.1.0
        with:
          command: release
          version: ${{ inputs.version || 'auto' }}

  # "Re-run failed jobs" on this job publishes what a failed run left: npm
  # skips a version that it already has.
  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # No package has a publish lifecycle script, and the action publishes
      # with --ignore-scripts: this step builds what is published.
      - name: Build all packages
        run: npm run build

      # Changes the "*" inter-package ranges to the released version.
      - name: Sync inter-package versions
        run: node scripts/sync-versions.js

      # Trusted publishing (OIDC): no npm token. A prerelease goes to `next`.
      # Dependencies first.
      - name: Publish @studiometa/forge-api
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/api
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}

      - name: Publish @studiometa/forge-sdk
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/sdk
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}

      - name: Publish @studiometa/forge-core
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/core
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}

      - name: Publish @studiometa/forge-mcp
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/mcp
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}

      - name: Publish @studiometa/forge-cli
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/cli
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}
